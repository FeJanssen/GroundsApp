version: 1
applications:
  - appRoot: app
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # EXPO_PUBLIC_API_URL in den Amplify-Umgebungsvariablen setzen!
            - npx expo export --platform web
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: Strict-Transport-Security
              value: max-age=31536000; includeSubDomains
